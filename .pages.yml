media:
  input: public/uploads
  output: /uploads
content:
  - name: events
    label: Events & Blog Posts
    type: collection
    path: src/content/events
    filename: "{primary}.md"
    view:
      fields: [title, date, category, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event title
        type: string
        required: true
      - name: date
        label: Event date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Community, Education, Environment, Health, Fundraising, Celebration, Other]
        required: true
      - name: location
        label: Location / venue
        type: string
      - name: excerpt
        label: Short summary
        type: text
        required: true
      - name: cover
        label: Cover photo
        type: image
      - name: featured
        label: Feature on homepage carousel
        type: boolean
        default: false
      - name: draft
        label: Keep as draft
        type: boolean
        default: false
      - name: gallery
        label: Additional event photos
        type: image
        list: true
      - name: body
        label: Full story
        type: rich-text
        options:
          media: true
          path: public/uploads
          extensions: [jpg, jpeg, png, webp]
